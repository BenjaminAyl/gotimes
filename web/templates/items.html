{{define "items"}}{{if .Rows}}<ol>
{{range .Rows}}{{template "item" .}}
{{end}}</ol>{{else}}<p class="quiet">{{if .Q}}No dispatches match “{{.Q}}”.{{else}}Nothing to read here.{{end}}</p>{{end}}{{end}}

{{define "item"}}<li id="item-{{.ID}}" class="row" data-read="{{.Read}}">
  <button type="button" class="row-btn"{{if .Selected}} aria-current="true"{{end}}
          hx-get="/items/{{.ID}}" hx-target="#reader" hx-swap="innerHTML" data-story>
    <span class="kicker">{{.FeedTitle}}</span>
    <span class="headline">{{if .Title}}{{.Title}}{{else}}Untitled{{end}}</span>
    {{with .Summary}}<span class="snippet">{{.}}</span>{{end}}
    <span class="meta">{{.ShortDate}}{{with .Author}} &middot; {{.}}{{end}}</span>
  </button>
</li>{{end}}

{{define "notice"}}<p class="notice" role="alert">{{.}}</p>{{end}}
