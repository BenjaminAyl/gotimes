# The app is NOT published on a host port. Cloudflare Tunnel reaches it over the
# internal compose network at http://gotimes.internal:4444, so nothing is exposed on the LAN.
services:
  app:
    build: .
    restart: unless-stopped
    networks:
      default:
        aliases:
          - gotimes.internal  # dotted name; the dashboard rejects single-label hosts like "app"
    environment:
      ADDR: ":4444"
      DATA_DIR: /data
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/app/gotimes", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - app

volumes:
  data:
